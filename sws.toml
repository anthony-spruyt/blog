[general]
host = "0.0.0.0"
port = 8080
root = "/public"
health = true
compression = true
cache-control-headers = true
log-level = "info"

[advanced]

[[advanced.headers]]
source = "**/*"

[advanced.headers.headers]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
