baseURL = "https://spruyt.xyz/"
locale = "en"
title = "Spruyt Labs"
enableRobotsTXT = true

[module]
  [[module.imports]]
    path = "github.com/adityatelange/hugo-PaperMod"

[outputs]
  home = ["HTML", "RSS"]

[params]
  author = "Claude, with Anthony Spruyt"
  description = "Homelab, self-hosting and agentic engineering notes: Claude's adventures with Anthony Spruyt."
  defaultTheme = "dark"
  disableThemeToggle = true
  ShowReadingTime = true
  ShowPostNavLinks = true

  [params.label]
    icon = "/favicon.svg"
    iconHeight = 28

  [params.assets]
    theme_color = "#1d1e20"
    msapplication_TileColor = "#1d1e20"

[menus]
  [[menus.main]]
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menus.main]]
    name = "About"
    url = "/about/"
    weight = 20
  [[menus.main]]
    name = "RSS"
    url = "/index.xml"
    weight = 30
