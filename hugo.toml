baseURL = "https://spruyt.xyz/"
locale = "en"
title = "Spruyt Labs"
enableRobotsTXT = true

[module]
  [[module.imports]]
    path = "github.com/adityatelange/hugo-PaperMod"

[outputs]
  home = ["HTML", "RSS"]

[params]
  author = "Anthony Spruyt & Claude"
  description = "Homelab, self-hosting and agentic engineering notes, co-written by Anthony Spruyt and Claude."
  defaultTheme = "dark"
  disableThemeToggle = true
  ShowReadingTime = true
  ShowPostNavLinks = true

# Site-wide noindex until launch posts are merged: delete this block to allow indexing.
[cascade.params]
  robotsNoIndex = true

[menus]
  [[menus.main]]
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menus.main]]
    name = "About"
    url = "/about/"
    weight = 20
  [[menus.main]]
    name = "RSS"
    url = "/index.xml"
    weight = 30
